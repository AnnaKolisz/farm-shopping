<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bazarek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mystery+Quest&family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
  <script>
    // Ustawiamy motyw zanim strona się narysuje, żeby nie było "mignięcia" złego koloru.
    (function () {
      var saved = localStorage.getItem("bazarek-theme");
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="#" class="logo" id="logo">Bazarek</a>
    <div class="header-actions">
      <button type="button" id="theme-btn" class="icon-btn">
        <svg class="icon-sun" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"></path>
        </svg>
      </button>

      <div class="lang-menu" id="lang-menu">
        <button type="button" id="lang-btn" class="icon-btn lang-btn" aria-haspopup="true" aria-expanded="false" aria-controls="lang-list">
          <span id="lang-flag" class="flag" aria-hidden="true"></span>
          <span id="lang-code"></span>
          <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <ul id="lang-list" class="lang-list" hidden></ul>
      </div>
    </div>
  </header>
  <main>
    <section id="categories-view">
      <h1 id="categories-title" class="sr-only"></h1>
      <div id="categories" class="categories"></div>
    </section>

    <section id="varieties-view" hidden>
      <button type="button" id="back-btn" class="back-btn"></button>
      <h1 id="category-title"></h1>
      <input type="search" id="search" class="search" autocomplete="off">
      <p id="result-count" class="subtitle" aria-live="polite"></p>
      <div id="varieties" class="varieties"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
