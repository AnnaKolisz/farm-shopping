<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bazarek</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="#" class="logo" id="logo">🧺 <span id="app-title">Bazarek</span></a>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="pl" aria-pressed="true">PL</button>
      <button type="button" class="lang-btn" data-lang="fr" aria-pressed="false">FR</button>
    </div>
  </header>

  <main>
    <section id="categories-view">
      <h1 id="categories-title"></h1>
      <p id="categories-subtitle" class="subtitle"></p>
      <div id="categories" class="categories"></div>
    </section>

    <section id="varieties-view" hidden>
      <button type="button" id="back-btn" class="back-btn"></button>
      <h1 id="category-title"></h1>
      <input type="search" id="search" class="search" autocomplete="off">
      <p id="result-count" class="subtitle" aria-live="polite"></p>
      <div id="varieties" class="varieties"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
